<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egg Fried Rice - Cooking Game</title>
    <link rel="stylesheet" href="cooking-interface.css">
</head>
<body>
    <!-- Main Container -->
    <div class="container">
        <!-- Progress Bar -->
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <!-- Cooking Area (Wok Display) -->
        <div class="cooking-area" id="cookingArea">
            <div class="wok-container">
                <!-- Base wok image from kitchen textures -->
                <img src="textures/kitchen1.png" alt="Wok" class="wok-image" id="wokImage">

                <!-- Ingredient Overlays (appear when ingredients are added) -->
                <img src="textures/kitchen2.png" alt="Ingredients" class="ingredient-overlay" id="overlay1">
                <img src="textures/kitchen3.png" alt="More Ingredients" class="ingredient-overlay" id="overlay2">
            </div>
        </div>

        <!-- Ingredients Panel (Right Side) -->
        <div class="ingredients-panel" id="ingredientsPanel">
            <button class="ingredient-button" id="eggBtn" data-ingredient="egg">
                <div style="font-size: 80px;">🥚</div>
            </button>
            <button class="ingredient-button" id="riceBtn" data-ingredient="rice">
                <div style="font-size: 80px;">🍚</div>
            </button>
            <button class="ingredient-button" id="greenOnionBtn" data-ingredient="greenOnion">
                <div style="font-size: 80px;">🧅</div>
            </button>
            <button class="ingredient-button" id="oilBtn" data-ingredient="oil">
                <div style="font-size: 80px;">🛢️</div>
            </button>
        </div>

        <!-- Instruction Text (Bottom) -->
        <div class="instruction-text" id="instructionText">
            Click on the ingredients to add them to your wok! Start with egg 🥚
        </div>

        <!-- Final Screen (Hidden until complete) -->
        <div class="final-screen" id="finalScreen">
            <div class="final-image">
                <img src="textures/kitchen2.png" alt="Finished Dish" id="finalDishImage">
            </div>
            <div class="final-title">DELICIOUS!</div>
            <button class="reset-button" id="resetBtn">Cook Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
