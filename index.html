<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egg Fried Rice - Pure CSS Game</title>
    <link rel="stylesheet" href="cooking-interface.css">
</head>
<body>
    <!-- Hidden checkboxes for state management (CSS-only) -->
    <input type="checkbox" id="egg" class="ingredient-state" hidden>
    <input type="checkbox" id="rice" class="ingredient-state" hidden>
    <input type="checkbox" id="greenOnion" class="ingredient-state" hidden>
    <input type="checkbox" id="oil" class="ingredient-state" hidden>
    <input type="checkbox" id="reset" class="reset-state" hidden>

    <!-- Main Container -->
    <div class="container">
        <!-- Progress Bar -->
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>

        <!-- Cooking Area -->
        <div class="cooking-area">
            <div class="wok-container">
                <img src="textures/kitchen1.png" alt="Wok" class="wok-image">
                <img src="textures/kitchen2.png" alt="Ingredients" class="ingredient-overlay" id="overlay1">
                <img src="textures/kitchen3.png" alt="More Ingredients" class="ingredient-overlay" id="overlay2">
            </div>
        </div>

        <!-- Ingredients Panel -->
        <div class="ingredients-panel">
            <label for="egg" class="ingredient-button">
                <div style="font-size: 80px;">🥚</div>
            </label>
            <label for="rice" class="ingredient-button">
                <div style="font-size: 80px;">🍚</div>
            </label>
            <label for="greenOnion" class="ingredient-button">
                <div style="font-size: 80px;">🧅</div>
            </label>
            <label for="oil" class="ingredient-button">
                <div style="font-size: 80px;">🛢️</div>
            </label>
        </div>

        <!-- Instruction Text -->
        <div class="instruction-text">
            Click on ingredients to add them to your wok!
        </div>

        <!-- Final Screen -->
        <div class="final-screen">
            <div class="final-image">
                <img src="textures/kitchen2.png" alt="Finished Dish">
            </div>
            <div class="final-title">DELICIOUS!</div>
            <label for="reset" class="reset-button">Cook Again</label>
        </div>
    </div>
</body>
</html>
